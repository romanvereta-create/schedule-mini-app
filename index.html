<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <button id="btn-today" class="header-btn">Сегодня</button>
            <div class="nav-arrows"><button id="btn-prev-week" class="icon-btn">◀</button><button id="btn-next-week" class="icon-btn">▶</button></div>
            <h1 id="month-label">...</h1>
        </div>
        <div class="week-days-container"><div class="time-spacer"></div><div class="days-row" id="days-header"></div></div>
    </header>

    <main id="calendar-container"><div class="calendar-grid"><div class="time-column" id="time-labels"></div><div class="days-grid" id="week-grid"></div><div class="events-layer" id="events-layer"></div></div></main>

    <div id="move-hint" class="move-hint-bar hidden"><span>📍 Кликните слот для переноса</span></div>

    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title">Занятие</h2>
            <input type="hidden" id="lesson-id"><input type="hidden" id="lesson-date"><input type="hidden" id="lesson-time">
            <div class="form-group">
                <label>Ученик</label>
                <select id="student-select"><option value="">Выбрать...</option><option value="manual">Вписать вручную</option></select>
                <input type="text" id="manual-student-name" class="hidden" placeholder="Имя ученика">
            </div>
            <div class="form-group"><label>Время (чч:мм)</label><input type="time" id="edit-time"></div>
            <div class="form-group" id="repeat-group">
                <label>Повтор</label>
                <select id="lesson-repeat"><option value="no">Разово</option><option value="month">На месяц</option><option value="year">На учебный год</option></select>
            </div>
            <div class="form-group"><input type="text" id="zoom-link" placeholder="Ссылка на Zoom"></div>
            <div class="modal-actions">
                <button id="btn-save" class="primary-btn">Сохранить</button>
                <div id="edit-actions" class="hidden">
                    <button id="btn-chat" class="secondary-btn">💬 Написать</button>
                    <button id="btn-delete" class="danger-btn">🗑 Удалить</button>
                </div>
                <button id="btn-cancel" class="secondary-btn">Отмена</button>
            </div>
        </div>
    </div>
    <script src="app.js?v=7"></script>
</body>
</html>
