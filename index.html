<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header>
            <h1 id="app-title">📅 Расписание</h1>
            <button id="btn-settings" class="icon-btn">⚙️</button>
        </header>

        <!-- Навигация по неделям -->
        <div class="week-nav">
            <button id="btn-prev-week">◀</button>
            <span id="week-label">Неделя</span>
            <button id="btn-next-week">▶</button>
            <button id="btn-today" class="today-btn">Сегодня</button>
        </div>

        <!-- Дни недели -->
        <div class="days-header" id="days-header">
            <span>ПН</span>
            <span>ВТ</span>
            <span>СР</span>
            <span>ЧТ</span>
            <span>ПТ</span>
            <span>СБ</span>
            <span>ВС</span>
        </div>

        <!-- Контент -->
        <div id="content">
            <div id="schedule-container">
                <!-- Здесь будет расписание -->
            </div>
        </div>

        <!-- Нижняя панель действий -->
        <div class="bottom-actions">
            <button id="btn-add-lesson" class="primary-btn">➕ Добавить занятие</button>
        </div>

        <!-- Модальные окна -->
        <div id="modal-overlay" style="display:none;">
            <div id="modal-content">
                <span id="modal-close" class="close-btn">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script>
        // Перехватываем ответы от бота
        // В Telegram Mini App, когда бот отправляет сообщение в ответ на web_app_data,
        // оно приходит как обычное текстовое сообщение.
        // Мы используем глобальную функцию для обработки
        
        // Функция, которая будет вызвана из бота (если бот отправит eval)
        window.processBotResponse = function(data) {
            if (window.handleBotResponse) {
                window.handleBotResponse(data);
            }
        };
        
        // Также перехватываем любые сообщения, которые приходят через WebApp
        // Это можно сделать через Telegram.WebApp.onEvent
        if (window.Telegram && window.Telegram.WebApp) {
            // Нет прямого события для получения сообщений,
            // но мы можем использовать polling или WebSocket
            console.log('Telegram WebApp initialized');
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
