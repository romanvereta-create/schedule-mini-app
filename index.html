<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание Календарь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
    <div id="app">
        <header class="main-header">
            <div class="header-top">
                <button id="btn-today" class="header-btn">Сегодня</button>
                <div class="nav-arrows">
                    <button id="btn-prev-week" class="icon-btn">◀</button>
                    <button id="btn-next-week" class="icon-btn">▶</button>
                </div>
                <h1 id="month-label">...</h1>
                <button id="btn-refresh" class="icon-btn">🔄</button>
            </div>
            <div class="week-days-container">
                <div class="time-spacer"></div>
                <div class="days-row" id="days-header"></div>
            </div>
        </header>

        <main id="calendar-container">
            <div class="calendar-grid">
                <div class="time-column" id="time-labels"></div>
                <div class="days-grid" id="week-grid"></div>
                <div class="events-layer" id="events-layer"></div>
            </div>
        </main>
    </div>

    <div id="move-hint" class="move-hint-bar hidden">
        <span>📍 Выберите новое время</span>
        <button onclick="cancelMove()" style="background:none; border:1px solid white; color:white; border-radius:12px; padding:2px 8px; font-size:11px;">Отмена</button>
    </div>

    <!-- Здесь модальное окно (оставьте как было в прошлом варианте) -->
    <div id="modal-overlay" class="hidden">...</div> 

    <script src="app.js?v=5"></script>
</body>
</html>
