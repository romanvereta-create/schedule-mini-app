<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <div class="date-picker-wrapper">
                <button id="btn-today" class="header-btn">Сегодня</button>
            </div>
            <div class="nav-arrows">
                <button id="btn-prev-week" class="icon-btn">◀</button>
                <span id="week-label-indicator">неделя</span>
                <button id="btn-next-week" class="icon-btn">▶</button>
            </div>
            <div class="month-label-wrapper">
                <h1 id="month-label" title="Нажмите для выбора даты">...</h1>
                <input type="date" id="date-picker-input" class="hidden-date-input">
            </div>
        </div>
        <div class="week-days-container">
            <div class="time-spacer">
                <button id="btn-zoom-in" class="zoom-btn" title="Увеличить">➕</button>
                <button id="btn-zoom-out" class="zoom-btn" title="Уменьшить">➖</button>
            </div>
            <div class="days-row" id="days-header"></div>
        </div>
    </header>

    <main id="calendar-container">
        <div class="calendar-grid">
            <div class="time-column" id="time-labels"></div>
            <div class="days-grid" id="week-grid"></div>
            <div class="events-layer" id="events-layer">
                <div id="current-time-line" class="current-time-line hidden"><div class="time-line-dot"></div></div>
            </div>
        </div>
    </main>

    <div id="move-hint" class="move-hint-bar hidden">
        <span>📍 Кликните целевой слот</span>
        <button id="btn-cancel-move" class="cancel-move-btn">Отмена</button>
    </div>

    <!-- МЕНЮ ДЕЙСТВИЙ -->
    <div id="action-menu-overlay" class="hidden">
        <div class="modal-content text-center">
            <h2 id="action-menu-title">Ученик</h2>
            <div class="modal-actions-column">
                <button id="btn-action-chat-student" class="action-menu-btn">💬 Написать ученику</button>
                <button id="btn-action-chat-parent" class="action-menu-btn">💬 Написать родителю</button>
                <button id="btn-action-paid" class="action-menu-btn paid-btn">💳 Оплатил</button>
                <button id="btn-action-move-trigger" class="action-menu-btn">🔄 Перенести</button>
                <button id="btn-action-settings" class="action-menu-btn">⚙️ Настройки</button>
                <button id="btn-action-delete" class="action-menu-btn delete-btn">🗑 Удалить</button>
                <button id="btn-action-close" class="secondary-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА (Действия переноса/удаления/настроек) -->
    <div id="modal-overlay" class="hidden">...</div>
    <div id="move-modal-overlay" class="hidden">...</div>
    <div id="delete-modal-overlay" class="hidden">...</div>
    <div id="color-modal-overlay" class="hidden">...</div>

    <script src="app.js?v=12"></script>
</body>
</html>
