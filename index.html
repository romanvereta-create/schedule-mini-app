<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <button id="btn-today" class="header-btn">Сегодня</button>
            <div class="nav-arrows">
                <button id="btn-prev-week" class="icon-btn">◀</button>
                <button id="btn-next-week" class="icon-btn">▶</button>
            </div>
            <h1 id="month-label">...</h1>
        </div>
        <div class="week-days-container">
            <div class="time-spacer"></div>
            <div class="days-row" id="days-header"></div>
        </div>
    </header>

    <main id="calendar-container">
        <div class="calendar-grid">
            <div class="time-column" id="time-labels"></div>
            <div class="days-grid" id="week-grid"></div>
            <div class="events-layer" id="events-layer"></div>
        </div>
    </main>

    <div id="move-hint" class="move-hint-bar hidden">
        <span>📍 Кликните целевой слот для переноса</span>
        <button id="btn-cancel-move" class="cancel-move-btn">Отмена</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПЕРЕНОСА (РАЗОВО ИЛИ НАВСЕГДА) -->
    <div id="move-modal-overlay" class="hidden">
        <div class="modal-content text-center">
            <h2>Перенос занятия</h2>
            <p id="move-modal-desc" class="modal-desc">Как перенести это занятие?</p>
            <div class="modal-actions-column">
                <button id="btn-move-once" class="primary-btn">Только на этой неделе (разово)</button>
                <button id="btn-move-all" class="secondary-btn">Все будущие (навсегда)</button>
                <button id="btn-move-cancel" class="danger-btn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ / НАСТРОЕК -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modal-title">Занятие</h2>
                <span id="btn-close-modal" class="close-modal">&times;</span>
            </header>
            <div class="modal-body">
                <input type="hidden" id="lesson-id">
                <input type="hidden" id="lesson-date">

                <div id="form-container">
                    <div class="form-group">
                        <label>Ученик</label>
                        <select id="student-select">
                            <option value="">-- Выбрать ученика --</option>
                            <option value="manual">Вписать вручную...</option>
                        </select>
                        <input type="text" id="manual-student-name" class="hidden" placeholder="Имя ученика">
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>Время начала</label>
                            <input type="time" id="lesson-time" step="300">
                        </div>
                        <div class="form-group flex-1">
                            <label>Длительность (мин)</label>
                            <input type="number" id="lesson-duration" value="60" min="15" step="5">
                        </div>
                    </div>

                    <div class="form-group" id="repeat-group">
                        <label>Повтор</label>
                        <select id="lesson-repeat">
                            <option value="no">Только сегодня (разово)</option>
                            <option value="month">Каждую неделю на месяц</option>
                            <option value="year">На учебный год (до 31 мая)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Напомнить за (минут)</label>
                        <input type="number" id="reminder-minutes" value="60" min="0" step="5">
                    </div>

                    <div class="form-group">
                        <label>Ссылка на Zoom / Telemost</label>
                        <input type="text" id="zoom-link" placeholder="https://zoom.us/...">
                    </div>
                    
                    <div class="form-group">
                        <label>Текст сообщения для ученика</label>
                        <textarea id="reminder-text" rows="2" placeholder="Например: Встречаемся в Zoom!"></textarea>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="btn-save" class="primary-btn">Сохранить</button>
                    <div id="edit-actions" class="hidden">
                        <button id="btn-chat" class="secondary-btn">💬 Написать</button>
                        <button id="btn-delete" class="danger-btn">🗑 Удалить</button>
                    </div>
                    <button id="btn-cancel-modal" class="secondary-btn">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=9"></script>
</body>
</html>
