<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #ffffff; color: #000000; min-height: 100vh; padding-bottom: 80px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #e0e0e0; }
        header h1 { font-size: 20px; font-weight: 600; }
        .week-nav { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; }
        .week-nav button { background: #f0f0f0; border: none; border-radius: 8px; padding: 6px 14px; font-size: 16px; cursor: pointer; }
        .week-nav #week-label { font-weight: 500; font-size: 15px; min-width: 120px; text-align: center; }
        .today-btn { background: #31b545 !important; color: white !important; }
        .days-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 8px 0; background: #f0f0f0; font-size: 13px; font-weight: 600; }
        #content { padding: 12px 16px; }
        #schedule-container { 
            min-height: 200px; 
        }
        .slot-row { 
            display: grid; 
            grid-template-columns: 70px 1fr 40px 40px; 
            gap: 6px; 
            align-items: center; 
            padding: 8px 10px; 
            background: #ffffff; 
            border-radius: 10px; 
            margin-bottom: 4px; 
            border: 1px solid #e0e0e0; 
        }
        .slot-time { font-weight: 600; font-size: 14px; }
        .slot-student { font-size: 14px; }
        .slot-empty { color: #e0e0e0; font-size: 14px; text-align: center; }
        .slot-bell { font-size: 16px; text-align: center; }
        .slot-delete { font-size: 16px; text-align: center; color: #ff3b30; }
        .bottom-actions { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px 16px; background: #ffffff; border-top: 1px solid #e0e0e0; }
        .primary-btn { width: 100%; padding: 14px; background: #31b545; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .empty-state { text-align: center; padding: 40px 20px; color: #000000; opacity: 0.6; }
        .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>📅 Расписание</h1>
            <button id="btn-settings" style="background:none;border:none;font-size:22px;cursor:pointer;">⚙️</button>
        </header>

        <div class="week-nav">
            <button id="btn-prev-week">◀</button>
            <span id="week-label">Неделя</span>
            <button id="btn-next-week">▶</button>
            <button id="btn-today" class="today-btn">Сегодня</button>
        </div>

        <div class="days-header">
            <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span>
            <span>ПТ</span><span>СБ</span><span>ВС</span>
        </div>

        <div id="content">
            <!-- ВОТ ЗДЕСЬ КОНТЕЙНЕР -->
            <div id="schedule-container">
                <div class="empty-state">
                    <div class="big-icon">📅</div>
                    <p>Нет занятий</p>
                </div>
            </div>
        </div>

        <div class="bottom-actions">
            <button id="btn-add-lesson" class="primary-btn">➕ Добавить занятие</button>
        </div>
    </div>

    <script>
        // ГЛОБАЛЬНЫЙ ОБРАБОТЧИК
        window.handleBotResponse = function(data) {
            console.log('📥 ПОЛУЧЕН ОТВЕТ:', data);
            try {
                if (typeof data === 'string' && data.includes('__MINIAPP_RESPONSE__')) {
                    const jsonStr = data.replace('__MINIAPP_RESPONSE__', '');
                    const parsed = JSON.parse(jsonStr);
                    console.log('📥 ПАРСИНГ:', parsed);
                    
                    if (parsed.action === 'get_schedule') {
                        const container = document.getElementById('schedule-container');
                        if (!container) {
                            console.error('❌ Контейнер не найден!');
                            return;
                        }
                        
                        const slots = parsed.slots || [];
                        const lessons = parsed.lessons || [];
                        let html = '';
                        
                        if (lessons.length === 0) {
                            html = '<div class="empty-state"><div class="big-icon">📅</div><p>Нет занятий</p></div>';
                        } else {
                            slots.forEach(slot => {
                                const lesson = lessons.find(l => l.time === slot);
                                if (lesson) {
                                    html += `<div class="slot-row">
                                        <span class="slot-time">${slot}</span>
                                        <span class="slot-student">${lesson.student || 'Неизвестно'}</span>
                                        <span class="slot-bell">🔔</span>
                                        <span class="slot-delete">🗑</span>
                                    </div>`;
                                } else {
                                    html += `<div class="slot-row">
                                        <span class="slot-time">${slot}</span>
                                        <span class="slot-empty">➕</span>
                                        <span class="slot-bell"></span>
                                        <span class="slot-delete"></span>
                                    </div>`;
                                }
                            });
                        }
                        
                        container.innerHTML = html;
                        console.log('✅ Расписание обновлено!');
                    }
                }
            } catch(e) {
                console.error('❌ Ошибка:', e);
            }
        };
        
        console.log('✅ Обработчик готов!');
        console.log('🔍 Контейнер:', document.getElementById('schedule-container'));
    </script>
    <script src="app.js?v=2"></script>
</body>
</html>
