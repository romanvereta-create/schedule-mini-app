<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <button id="btn-today" class="header-btn">Сегодня</button>
            <div class="nav-arrows">
                <button id="btn-prev-week" class="icon-btn">◀</button>
                <span id="week-label-indicator">неделя</span>
                <button id="btn-next-week" class="icon-btn">▶</button>
            </div>
            <div class="month-label-wrapper">
                <h1 id="month-label" title="Нажмите для выбора даты">...</h1>
                <input type="date" id="date-picker-input" class="hidden-date-input">
            </div>
        </div>
        <div class="week-days-container">
            <div class="time-spacer">
                <button id="btn-zoom-in" class="zoom-btn" title="Увеличить высоту">🔍+</button>
                <button id="btn-zoom-out" class="zoom-btn" title="Уменьшить высоту">🔍−</button>
            </div>
            <div class="days-row" id="days-header"></div>
        </div>
    </header>

    <main id="calendar-container">
        <div class="calendar-grid">
            <div class="time-column" id="time-labels"></div>
            <div class="days-grid" id="week-grid"></div>
            <div class="events-layer" id="events-layer">
                <div id="current-time-line" class="current-time-line hidden">
                    <div class="time-line-dot"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подсказка режима переноса -->
    <div id="move-hint" class="move-hint-bar hidden">
        <span>📍 Кликните целевой слот для переноса/добавления</span>
        <button id="btn-cancel-move" class="cancel-move-btn">Отмена</button>
    </div>

    <!-- МЕНЮ ДЕЙСТВИЙ (Короткий клик по ученику) -->
    <div id="action-menu-overlay" class="hidden">
        <div class="modal-content text-center">
            <h2 id="action-menu-title">Ученик</h2>
            <div class="modal-actions-column">
                <button id="btn-action-chat-student" class="action-menu-btn">💬 Написать ученику</button>
                <button id="btn-action-chat-parent" class="action-menu-btn">💬 Написать родителю</button>
                <button id="btn-action-paid" class="action-menu-btn paid-btn">💳 Оплатил</button>
                <button id="btn-action-move-trigger" class="action-menu-btn">🔄 Перенести</button>

                <!-- ПАЛИТРА ЦВЕТОВ (вместо кнопки) -->
                <div class="inline-color-palette">
                    <div class="color-swatch color-0" data-color="0"></div>
                    <div class="color-swatch color-1" data-color="1"></div>
                    <div class="color-swatch color-2" data-color="2"></div>
                    <div class="color-swatch color-3" data-color="3"></div>
                    <div class="color-swatch color-4" data-color="4"></div>
                    <div class="color-swatch color-5" data-color="5"></div>
                    <div class="color-swatch color-6" data-color="6"></div>
                    <div class="color-swatch color-7" data-color="7"></div>
                    <div class="color-swatch color-picker-open" id="color-picker-open">🎨</div>
                </div>

                <button id="btn-action-settings" class="action-menu-btn">⚙️ Настройки</button>
                <button id="btn-action-delete" class="action-menu-btn delete-btn">🗑 Удалить</button>
                <button id="btn-action-close" class="secondary-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- ДИАЛОГ ПЕРЕНОСА / КОПИРОВАНИЯ -->
    <div id="move-modal-overlay" class="hidden">
        <div class="modal-content text-center">
            <h2>Действие с занятием</h2>
            <p id="move-modal-desc" class="modal-desc"></p>
            <div class="modal-actions-column">
                <button id="btn-action-copy" class="primary-btn">➕ Добавить ещё одним занятием</button>
                <button id="btn-action-move-once" class="secondary-btn">🔄 Перенести (разово)</button>
                <button id="btn-action-move-all" class="secondary-btn">🔄 Перенести все будущие</button>
                <button id="btn-action-move-cancel" class="danger-btn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ДИАЛОГ УДАЛЕНИЯ -->
    <div id="delete-modal-overlay" class="hidden">
        <div class="modal-content text-center">
            <h2>Удаление занятия</h2>
            <p class="modal-desc">Как удалить это занятие?</p>
            <div class="modal-actions-column">
                <button id="btn-delete-once" class="danger-btn">Удалить только это занятие</button>
                <button id="btn-delete-all" class="danger-btn">Удалить все будущие (навсегда)</button>
                <button id="btn-delete-cancel" class="secondary-btn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК / ДОБАВЛЕНИЯ ЗАНЯТИЯ -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modal-title">Настройки занятия</h2>
                <span id="btn-close-modal" class="close-modal">&times;</span>
            </header>
            <div class="modal-body">
                <input type="hidden" id="lesson-id">
                <input type="hidden" id="lesson-date">

                <div id="form-container">
                    <!-- Выбор или ввод ученика при СОЗДАНИИ -->
                    <div class="form-group" id="student-select-group">
                        <label>Ученик</label>
                        <select id="student-select">
                            <option value="">-- Выбрать ученика --</option>
                            <option value="manual">Вписать вручную...</option>
                        </select>
                        <input type="text" id="manual-student-name" class="hidden" placeholder="Имя ученика">
                    </div>

                    <!-- Отображение ученика при РЕДАКТИРОВАНИИ -->
                    <div class="form-group hidden" id="student-fixed-group">
                        <label>Ученик</label>
                        <input type="text" id="fixed-student-name" readonly class="readonly-input">
                    </div>

                    <!-- Контакты родителя (несколько мессенджеров) -->
                    <div class="form-group">
                        <label>Контакты родителя</label>
                        <div id="contacts-container">
                            <div class="contact-row" data-type="tg">
                                <span class="contact-icon">💬</span>
                                <input type="text" class="contact-input" placeholder="@username или ID" data-field="tg">
                                <button class="contact-remove-btn" style="display:none;">✕</button>
                            </div>
                            <div class="contact-row" data-type="wa">
                                <span class="contact-icon">📱</span>
                                <input type="text" class="contact-input" placeholder="WhatsApp номер" data-field="wa">
                                <button class="contact-remove-btn" style="display:none;">✕</button>
                            </div>
                            <div class="contact-row" data-type="phone">
                                <span class="contact-icon">☎️</span>
                                <input type="text" class="contact-input" placeholder="Телефон" data-field="phone">
                                <button class="contact-remove-btn" style="display:none;">✕</button>
                            </div>
                            <div class="contact-row" data-type="max">
                                <span class="contact-icon">M</span>
                                <input type="text" class="contact-input" placeholder="Max (ник)" data-field="max">
                                <button class="contact-remove-btn" style="display:none;">✕</button>
                            </div>
                            <button id="add-contact-btn" class="secondary-btn" style="margin-top:6px;padding:4px 8px;font-size:12px;">➕ Добавить контакт</button>
                        </div>
                    </div>

                    <!-- Время и Длительность -->
                    <div class="form-row" id="time-duration-group">
                        <div class="form-group flex-1">
                            <label>Время начала</label>
                            <input type="time" id="lesson-time" step="300">
                        </div>
                        <div class="form-group flex-1">
                            <label>Длительность (мин)</label>
                            <input type="number" id="lesson-duration" value="60" min="15" step="5">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Стоимость урока (руб.)</label>
                        <input type="text" id="lesson-price" placeholder="например: 1500">
                    </div>

                    <div class="form-group" id="repeat-group">
                        <label>Повтор</label>
                        <select id="lesson-repeat">
                            <option value="no">Только сегодня (разово)</option>
                            <option value="month">Каждую неделю на месяц</option>
                            <option value="year">На учебный год (до 31 мая)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Напомнить за (минут)</label>
                        <input type="number" id="reminder-minutes" value="60" min="0" step="5">
                    </div>

                    <div class="form-group">
                        <label>Ссылка на Zoom / Telemost</label>
                        <input type="text" id="zoom-link" placeholder="https://zoom.us/...">
                    </div>
                    
                    <div class="form-group">
                        <label>Текст сообщения для ученика</label>
                        <textarea id="reminder-text" rows="2" placeholder="Например: Встречаемся в Zoom!"></textarea>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="btn-save" class="primary-btn">Сохранить</button>
                    <button id="btn-cancel-modal" class="secondary-btn">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=15"></script>
</body>
</html>
